<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Personlig økonomi</title>
  <meta name="description" content="Budget, transaktioner, formue og investeringer – gemt lokalt på din enhed.">
  <meta name="theme-color" content="#0B0F1A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script>
    (function () {
      var t = "dark";
      try { t = localStorage.getItem("theme") || "dark"; } catch (e) {}
      document.documentElement.setAttribute("data-theme", t);
      var light = t === "light" || (t === "system" && window.matchMedia("(prefers-color-scheme: light)").matches);
      if (light) document.querySelector('meta[name="theme-color"]').setAttribute("content", "#F3F5FB");
    })();
  </script>
  <meta name="apple-mobile-web-app-title" content="Økonomi">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="root"><div class="boot">Indlæser…</div></div>
  <noscript>Appen kræver JavaScript.</noscript>
  <script type="module" src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      // When a new version's service worker takes over, reload once so the new files are used right away.
      var hadController = !!navigator.serviceWorker.controller, reloaded = false;
      navigator.serviceWorker.addEventListener("controllerchange", function () {
        if (hadController && !reloaded) { reloaded = true; location.reload(); }
      });
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(() => {}));
    }
  </script>
</body>
</html>
